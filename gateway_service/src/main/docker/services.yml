# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: gateway_service
services:
  postgresql:
    extends:
      file: ./postgresql.yml
      service: postgresql
  consul:
    extends:
      file: ./consul.yml
      service: consul
  consul-config-loader:
    extends:
      file: ./consul.yml
      service: consul-config-loader
  otel-collector:
    extends:
      file: ./otel.yml
      service: otel-collector
  jaeger:
    extends:
      file: ./jaeger.yml
      service: jaeger
  prometheus:
    extends:
      file: ./prometheus.yml
      service: prometheus
  redis:
    extends:
      file: ./redis.yml
      service: redis
  redis-commander:
    extends:
      file: ./redis.yml
      service: redis-commander

volumes:
  redis-data:
    driver: local

  prometheus_db:

