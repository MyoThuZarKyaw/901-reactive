chaos:
  monkey:
    enabled: true

management:
  endpoint:
    chaosmonkey:
      enabled: true
    chaosmonkeyjmx:
      enabled: true

  endpoints:
    web:
      exposure:
        # include all endpoints
        # include: "*"
        # include specific endpoints
         include:
           - configprops
           - env
           - health
           - info
           - jhimetrics
           - jhiopenapigroups
           - logfile
           - loggers
           - prometheus
           - threaddump
           - caches
           - liquibase
           - chaosmonkey
